name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: npm publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@notyza/sdk@$VERSION" version >/dev/null 2>&1; then echo "$VERSION is already on npm"; exit 0; fi
          npm publish --provenance --access public
